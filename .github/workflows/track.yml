name: ktown4u-track
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-track:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: set python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install req
        run: |
          pip install requests
      - name: run script
        run: |
          python ktown4u_ci.py
      - name: save data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/*.csv || true
          git commit -m "auto update track csv" || true
          git push
